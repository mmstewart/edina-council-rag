[project]
name = "edina-rag"
version = "0.1.0"
description = "Retrieval-augmented QA over City of Edina, MN city council meeting records"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Model dependencies (fastembed, ollama) are added in the milestones that use them.
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edina_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres at DATABASE_URL (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
